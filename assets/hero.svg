<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Marco González Gamboa — Technical Lead</title>
  <desc id="d">Technical Lead e Ingeniero en Informática en Santiago de Chile. Áreas: arquitectura de software, SAP Business One, backend .NET y DevOps.</desc>
  <defs>
    <radialGradient id="glow" cx=".85" cy="0" r=".7">
      <stop stop-color="#5e6ad2" stop-opacity=".28"/><stop offset="1" stop-color="#5e6ad2" stop-opacity="0"/>
    </radialGradient>
    <style>
      text{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
      .f{opacity:0;animation:f .7s cubic-bezier(.22,1,.36,1) forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}
      @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1}}
    </style>
  </defs>
  <rect width="960" height="360" rx="16" fill="#08090a"/>
  <rect width="960" height="360" rx="16" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="959" height="359" rx="15.5" fill="none" stroke="#23252a"/>

  <g class="f">
    <rect x="48" y="44" width="28" height="28" rx="7" fill="#5e6ad2"/>
    <text x="62" y="63" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">MG</text>
    <text class="m" x="90" y="63" fill="#8a8f98" font-size="12" letter-spacing=".6">TECHNICAL LEAD · INGENIERO EN INFORMÁTICA · SANTIAGO, CL</text>
  </g>

  <text class="f d1" x="48" y="132" fill="#f7f8f8" font-size="46" font-weight="600" letter-spacing="-1.6">Marco González Gamboa</text>
  <text class="f d2" x="48" y="170" fill="#d0d6e0" font-size="19" letter-spacing="-.2">Arquitecturas .NET e integraciones SAP Business One que escalan.</text>
  <text class="f d2" x="48" y="196" fill="#8a8f98" font-size="14">Pensamiento sistémico · Código mantenible · Liderazgo técnico · Aprendizaje continuo</text>

  <g class="f d3">
    <rect x="48" y="232" width="204" height="88" rx="10" fill="#0f1011" stroke="#34343a"/>
    <text x="64" y="268" fill="#f7f8f8" font-size="15" font-weight="600" letter-spacing="-.3">Arquitectura de software</text>
    <text x="64" y="296" fill="#8a8f98" font-size="13">N-tier · MVC · Hexagonal</text>

    <rect x="268" y="232" width="204" height="88" rx="10" fill="#0f1011" stroke="#23252a"/>
    <text x="284" y="268" fill="#f7f8f8" font-size="15" font-weight="600" letter-spacing="-.3">SAP Business One</text>
    <text x="284" y="296" fill="#8a8f98" font-size="13">Service Layer · DI API · HANA</text>

    <rect x="488" y="232" width="204" height="88" rx="10" fill="#0f1011" stroke="#23252a"/>
    <text x="504" y="268" fill="#f7f8f8" font-size="15" font-weight="600" letter-spacing="-.3">Backend .NET</text>
    <text x="504" y="296" fill="#8a8f98" font-size="13">C# · ASP.NET Core · SQL</text>

    <rect x="708" y="232" width="204" height="88" rx="10" fill="#0f1011" stroke="#23252a"/>
    <text x="724" y="268" fill="#f7f8f8" font-size="15" font-weight="600" letter-spacing="-.3">DevOps</text>
    <text x="724" y="296" fill="#8a8f98" font-size="13">CI/CD · Jenkins · Docker</text>
  </g>
</svg>
