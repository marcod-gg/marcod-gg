<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="t d">
  <title id="t">Formación</title>
  <desc id="d">Formación como lista de builds: Diplomado en Inteligencia Artificial (Universidad Autónoma de Chile, 2025), Diplomado en Gestión de Proyectos TI (Duoc UC, 2024), Ingeniería en Informática (Duoc UC, 2016–2020) y certificaciones ITIL 4 Foundation e ISO/IEC 20000:2018 Foundation.</desc>
  <defs>
    <style>
      text{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace}
      .pulse{animation:p 2s ease-in-out infinite}
      @keyframes p{50%{opacity:.3}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
  </defs>
  <rect width="960" height="476" rx="16" fill="#08090a"/>
  <rect x=".5" y=".5" width="959" height="475" rx="15.5" fill="none" stroke="#23252a"/>

  <text class="m" x="40" y="48" fill="#8a8f98" font-size="12" letter-spacing=".6">FORMACIÓN</text>
  <text x="40" y="76" fill="#f7f8f8" font-size="22" font-weight="600" letter-spacing="-.5">Builds</text>
  <text class="m" x="920" y="76" text-anchor="end" fill="#62666d" font-size="12">education / main</text>
  <path d="M40 100H920" stroke="#23252a"/>

  <g class="m" font-size="11" fill="#62666d" letter-spacing=".4">
    <text x="40" y="132">PROGRAMA</text><text x="420" y="132">STATUS</text><text x="530" y="132">FOCO</text><text x="920" y="132" text-anchor="end">AÑO</text>
  </g>

  <path d="M40 148H920" stroke="#141516"/>
  <text x="40" y="180" fill="#f7f8f8" font-size="15" font-weight="600">Diplomado en Inteligencia Artificial</text>
  <text class="m" x="40" y="202" fill="#62666d" font-size="12">universidad-autonoma-de-chile</text>
  <circle class="pulse" cx="426" cy="186" r="4" fill="#828fff"/><text x="440" y="191" fill="#f7f8f8" font-size="14">Latest</text>
  <text x="530" y="191" fill="#8a8f98" font-size="14">IA aplicada a procesos y productos de software</text>
  <text class="m" x="920" y="191" text-anchor="end" fill="#8a8f98" font-size="12">2025</text>

  <path d="M40 226H920" stroke="#141516"/>
  <text x="40" y="258" fill="#f7f8f8" font-size="15" font-weight="600">Diplomado en Gestión de Proyectos TI</text>
  <text class="m" x="40" y="280" fill="#62666d" font-size="12">duoc-uc</text>
  <circle cx="426" cy="264" r="4" fill="#5e6ad2"/><text x="440" y="269" fill="#f7f8f8" font-size="14">Ready</text>
  <text x="530" y="269" fill="#8a8f98" font-size="14">Planificación, PMBOK y gestión de equipos</text>
  <text class="m" x="920" y="269" text-anchor="end" fill="#8a8f98" font-size="12">2024</text>

  <path d="M40 304H920" stroke="#141516"/>
  <text x="40" y="336" fill="#f7f8f8" font-size="15" font-weight="600">Ingeniería en Informática</text>
  <text class="m" x="40" y="358" fill="#62666d" font-size="12">duoc-uc</text>
  <circle cx="426" cy="342" r="4" fill="#5e6ad2"/><text x="440" y="347" fill="#f7f8f8" font-size="14">Ready</text>
  <text x="530" y="347" fill="#8a8f98" font-size="14">Ingeniería de software, bases de datos y redes</text>
  <text class="m" x="920" y="347" text-anchor="end" fill="#8a8f98" font-size="12">2020</text>

  <path d="M40 382H920" stroke="#141516"/>
  <text x="40" y="414" fill="#f7f8f8" font-size="15" font-weight="600">ITIL 4 · ISO/IEC 20000:2018</text>
  <text class="m" x="40" y="436" fill="#62666d" font-size="12">certificaciones · foundation</text>
  <circle cx="426" cy="420" r="4" fill="#5e6ad2"/><text x="440" y="425" fill="#f7f8f8" font-size="14">Ready</text>
  <text x="530" y="425" fill="#8a8f98" font-size="14">Gestión de servicios TI</text>
  <text class="m" x="920" y="425" text-anchor="end" fill="#62666d" font-size="12">cert</text>
</svg>
